"models":
- "classname": |-
    Customer
  "code": "class Customer(Base):\n    __tablename__ = 'customer'\n    \n    id = Column(Integer,\
    \ primary_key=True, autoincrement=True)\n    name = Column(String)\n    balance\
    \ = Column(Numeric, default=0)\n    credit_limit = Column(Numeric)"
  "description": |-
    Customer entity representing individual customers in the system.
  "name": |-
    Customer
- "classname": |-
    Order
  "code": "class Order(Base):\n    __tablename__ = 'order'\n    \n    id = Column(Integer,\
    \ primary_key=True, autoincrement=True)\n    customer_id = Column(Integer, ForeignKey('customer.id'))\n\
    \    amount_total = Column(Numeric, default=0)\n    date_shipped = Column(DateTime)\n\
    \    notes = Column(String)\n    customer = relationship('Customer')"
  "description": |-
    Order entity representing customer orders.
  "name": |-
    Order
- "classname": |-
    Item
  "code": "class Item(Base):\n    __tablename__ = 'item'\n    \n    id = Column(Integer,\
    \ primary_key=True, autoincrement=True)\n    order_id = Column(Integer, ForeignKey('order.id'))\n\
    \    product_id = Column(Integer, ForeignKey('product.id'))\n    unit_price =\
    \ Column(Numeric)\n    quantity = Column(Integer)\n    amount = Column(Numeric,\
    \ default=0)\n    order = relationship('Order')\n    product = relationship('Product')"
  "description": |-
    Item entity representing order line items.
  "name": |-
    Item
- "classname": |-
    Product
  "code": "class Product(Base):\n    __tablename__ = 'product'\n    \n    id = Column(Integer,\
    \ primary_key=True, autoincrement=True)\n    name = Column(String)\n    unit_price\
    \ = Column(Numeric)"
  "description": |-
    Product entity representing product information.
  "name": |-
    Product
"name": |-
  OrderManagementSystem
"rules":
- "code": |-
    Rule.constraint(validate=Customer, as_condition=lambda row: row.balance <= row.credit_limit, error_msg="Customer balance ({row.balance}) exceeds credit limit ({row.credit_limit})")
  "description": |-
    Ensure customer balance is within credit limit.
  "entity": |-
    Customer
  "name": |-
    Check Credit: Customer Balance Constraint
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Customer.balance, as_sum_of=Order.amount_total, where=lambda row: row.date_shipped is None)
  "description": |-
    Customer balance as sum of order totals for non-shipped orders.
  "entity": |-
    Customer
  "name": |-
    Check Credit: Customer Balance Sum
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Order.amount_total, as_sum_of=Item.amount)
  "description": |-
    Order amount total calculated as sum of item amounts.
  "entity": |-
    Order
  "name": |-
    Check Credit: Order Amount Total Sum
  "use_case": |-
    Check Credit
- "code": |-
    Rule.formula(derive=Item.amount, as_expression=lambda row: row.quantity * row.unit_price)
  "description": |-
    Item amount derived from quantity times unit price.
  "entity": |-
    Item
  "name": |-
    Check Credit: Item Amount Formula
  "use_case": |-
    Check Credit
- "code": |-
    Rule.copy(derive=Item.unit_price, from_parent=Product.unit_price)
  "description": |-
    Item unit price copied from product.
  "entity": |-
    Item
  "name": |-
    Check Credit: Item Unit Price Copy
  "use_case": |-
    Check Credit
- "code": |-
    Rule.after_flush_row_event(on_class=Order, calling=lambda row, args: kafka_producer.send_row_to_kafka(row, **args), if_condition=lambda row: row.date_shipped is not None, with_args={"topic": "order_shipping"})
  "description": |-
    Send order to Kafka if shipped.
  "entity": |-
    Order
  "name": |-
    App Integration: Kafka Event for Order Shipping
  "use_case": |-
    App Integration
