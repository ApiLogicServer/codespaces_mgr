    Customer
  "code": |-
    class Customer(Base):
        __tablename__ = 'customer'

        id = Column(Integer, primary_key=True)
        name = Column(String)
        credit_limit = Column(Decimal)
        balance = Column(Decimal)  # Derived

        # Example SQLAlchemy table creation
        # CREATE TABLE customer (
        #     id INTEGER PRIMARY KEY,
        #     name VARCHAR,
        #     credit_limit DECIMAL,
        #     balance DECIMAL
        # )
  "description": |-
    Class representing a customer with derived balance.
  "name": |-
    Customer
- "classname": |-
    Order
  "code": |-
    class Order(Base):
        __tablename__ = 'order'

        id = Column(Integer, primary_key=True)
        customer_id = Column(Integer, ForeignKey('customer.id'))
        notes = Column(String)
        date_shipped = Column(DateTime)
        amount_total = Column(Decimal)  # Derived

        # Example SQLAlchemy table creation
        # CREATE TABLE order (
        #     id INTEGER PRIMARY KEY,
        #     customer_id INTEGER,
        #     notes VARCHAR,
        #     date_shipped DATETIME,
        #     amount_total DECIMAL,
        #     FOREIGN KEY (customer_id) REFERENCES customer(id)
        # )
  "description": |-
    Class representing an order with derived amount_total.
  "name": |-
    Order
- "classname": |-
    Item
  "code": |-
    class Item(Base):
        __tablename__ = 'item'

        id = Column(Integer, primary_key=True)
        order_id = Column(Integer, ForeignKey('order.id'))
        product_id = Column(Integer, ForeignKey('product.id'))
        quantity = Column(Integer)
        unit_price = Column(Decimal)
        amount = Column(Decimal)  # Derived

        # Example SQLAlchemy table creation
        # CREATE TABLE item (
        #     id INTEGER PRIMARY KEY,
        #     order_id INTEGER,
        #     product_id INTEGER,
        #     quantity INTEGER,
        #     unit_price DECIMAL,
        #     amount DECIMAL,
        #     FOREIGN KEY (order_id) REFERENCES order(id),
        #     FOREIGN KEY (product_id) REFERENCES product(id)
        # )
  "description": |-
    Class representing an item with derived amount.
  "name": |-
    Item
