"graphics": []
"models":
- "classname": |-
    Customer
  "code": |-
    class Customer(Base):
        __tablename__ = 'customer'

        id = Column(Integer, primary_key=True, autoincrement=True)
        name = Column(String)
        balance = Column(Decimal, default=0)
        credit_limit = Column(Decimal, default=1000)
  "description": |-
    A class containing Customer details, its balance and credit limit.
  "name": |-
    Customer
- "classname": |-
    Order
  "code": |-
    class Order(Base):
        __tablename__ = 'order'

        id = Column(Integer, primary_key=True, autoincrement=True)
        customer_id = Column(Integer, ForeignKey('customer.id'))
        amount_total = Column(Decimal, default=0)
        date_shipped = Column(DateTime)
        notes = Column(String)
  "description": |-
    A class representing an order with an amount, shipment date and associated customer.
  "name": |-
    Order
- "classname": |-
    Item
  "code": |-
    class Item(Base):
        __tablename__ = 'item'

        id = Column(Integer, primary_key=True, autoincrement=True)
        order_id = Column(Integer, ForeignKey('order.id'))
        product_id = Column(Integer, ForeignKey('product.id'))
        quantity = Column(Integer, default=1)
        unit_price = Column(Decimal, default=0)
        amount = Column(Decimal, default=0)
  "description": |-
    Items associate with orders having quantity and unit price values.
  "name": |-
    Item
- "classname": |-
    Product
  "code": |-
    class Product(Base):
        __tablename__ = 'product'

        id = Column(Integer, primary_key=True, autoincrement=True)
        name = Column(String)
        unit_price = Column(Decimal)
  "description": |-
    A product class which has unit price and name.
  "name": |-
    Product
"name": |-
  OrderManagementSystem
"rules":
- "code": |-
    Rule.constraint(validate=Customer,
                     as_condition=lambda row: row.balance <= row.credit_limit,
                     error_msg="Customer balance ({row.balance}) exceeds credit limit ({row.credit_limit})")
  "description": |-
    Customer's balance should not exceed credit limit.
  "entity": |-
    Customer
  "name": |-
    Customer Balance Constraint
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Customer.balance, as_sum_of=Order.amount_total, where=lambda row: row.date_shipped is None)
  "description": |-
    Calculate the balance of all orders with no shipped date for a customer.
  "entity": |-
    Customer
  "name": |-
    Customer Balance Sum
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Order.amount_total, as_sum_of=Item.amount)
  "description": |-
    Sum of item amounts for each order.
  "entity": |-
    Order
  "name": |-
    Order Amount Total Sum
  "use_case": |-
    Check Credit
- "code": |-
    Rule.formula(derive=Item.amount, as_expression=lambda row: row.quantity * row.unit_price)
  "description": |-
    Calculate item amount based on quantity and unit price.
  "entity": |-
    Item
  "name": |-
    Item Amount Formula
  "use_case": |-
    Check Credit
- "code": |-
    Rule.copy(derive=Item.unit_price, from_parent=Product.unit_price)
  "description": |-
    Copy product unit price to item unit price.
  "entity": |-
    Item
  "name": |-
    Item Unit Price Copy
  "use_case": |-
    Check Credit
- "code": |-
    Rule.after_flush_row_event(on_class=Order, calling=kafka_producer.send_row_to_kafka, if_condition=lambda row: row.date_shipped is not None, with_args={"topic": "order_shipping"})
  "description": |-
    Send order info to Kafka if date_shipped is not null.
  "entity": |-
    Order
  "name": |-
    Order Kafka Event
  "use_case": |-
    App Integration
