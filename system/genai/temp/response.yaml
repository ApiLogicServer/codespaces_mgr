"graphics": []
"models":
- "classname": |-
    Customer
  "code": "class Customer(Base):\n    __tablename__ = \"customer\"\n    \n    id =\
    \ Column(Integer, primary_key=True, autoincrement=True)\n    name = Column(String,\
    \ nullable=False)\n    credit_limit = Column(Decimal, nullable=False)\n    balance\
    \ = Column(Decimal, nullable=False, default=0.00)\n"
  "description": |-
    Defines the Customer entity with credit and balance attributes.
  "name": |-
    Customer
- "classname": |-
    Order
  "code": "class Order(Base):\n    __tablename__ = \"order\"\n    \n    id = Column(Integer,\
    \ primary_key=True, autoincrement=True)\n    customer_id = Column(Integer, ForeignKey('customer.id'),\
    \ nullable=False)\n    notes = Column(String)\n    date_shipped = Column(DateTime)\n\
    \    amount_total = Column(Decimal, nullable=False, default=0.00)\n"
  "description": |-
    Defines the Order entity, linked to Customer with a total amount and optional ship date.
  "name": |-
    Order
- "classname": |-
    Item
  "code": "class Item(Base):\n    __tablename__ = \"item\"\n    \n    id = Column(Integer,\
    \ primary_key=True, autoincrement=True)\n    order_id = Column(Integer, ForeignKey('order.id'),\
    \ nullable=False)\n    product_id = Column(Integer, ForeignKey('product.id'),\
    \ nullable=False)\n    unit_price = Column(Decimal, nullable=False)\n    quantity\
    \ = Column(Integer, nullable=False)\n    amount = Column(Decimal, nullable=False,\
    \ default=0.00)\n"
  "description": |-
    Defines the Item entity, with quantity, unit_price and calculated amount.
  "name": |-
    Item
- "classname": |-
    Product
  "code": "class Product(Base):\n    __tablename__ = \"product\"\n    \n    id = Column(Integer,\
    \ primary_key=True, autoincrement=True)\n    name = Column(String, nullable=False)\n\
    \    unit_price = Column(Decimal, nullable=False)\n"
  "description": |-
    Defines the Product entity with unit price.
  "name": |-
    Product
"name": |-
  CustomerOrders
"rules":
- "code": |-
    Rule.constraint(validate=Customer,
                    as_condition=lambda row: row.balance <= row.credit_limit,
                    error_msg="Customer balance ({row.balance}) exceeds credit limit ({row.credit_limit})")
  "description": |-
    Ensure Customer balance does not exceed credit limit
  "entity": |-
    Customer
  "name": |-
    Credit Limit Check
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Customer.balance, as_sum_of=Order.amount_total, where=lambda row: row.date_shipped is None)
  "description": |-
    Calculate Customer balance as sum of Order amount_total where date_shipped is null
  "entity": |-
    Customer
  "name": |-
    Sum Order Amount
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Order.amount_total, as_sum_of=Item.amount)
  "description": |-
    Calculate Order amount_total as sum of Item amount
  "entity": |-
    Order
  "name": |-
    Sum Item Amount
  "use_case": |-
    Check Credit
- "code": |-
    Rule.formula(derive=Item.amount, as_expression=lambda row: row.quantity * row.unit_price)
  "description": |-
    Calculate Item amount as quantity times unit_price
  "entity": |-
    Item
  "name": |-
    Calculate Item Amount
  "use_case": |-
    Check Credit
- "code": |-
    Rule.copy(derive=Item.unit_price, from_parent=Product.unit_price)
  "description": |-
    Copy the Product's unit price to the Item's unit price
  "entity": |-
    Item
  "name": |-
    Copy Product Unit Price
  "use_case": |-
    Check Credit
- "code": |-
    Rule.after_flush_row_event(on_class=Order,
                    calling=kafka_producer.send_row_to_kafka,
                    if_condition=lambda row: row.date_shipped is not None,
                    with_args={"topic": "order_shipping"})
  "description": |-
    Send the Order to Kafka topic 'order_shipping' when date_shipped is not None
  "entity": |-
    Order
  "name": |-
    Send Order to Kafka
  "use_case": |-
    App Integration
