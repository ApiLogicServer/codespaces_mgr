"graphics": []
"models":
- "classname": |-
    Customer
  "code": |-
    class Customer(Base):
        __tablename__ = "customer"

        Id = Column(Integer, primary_key=True, autoincrement=True)
        Name = Column(String)
        CreditLimit = Column(Decimal)
        Balance = Column(Decimal)
  "description": |-
    Represents a customer of the system. Includes balance and credit limit.
  "name": |-
    Customer
- "classname": |-
    Order
  "code": |-
    class Order(Base):
        __tablename__ = "order"

        Id = Column(Integer, primary_key=True, autoincrement=True)
        CustomerId = Column(Integer, ForeignKey("customer.Id"))
        DateShipped = Column(DateTime)
        Notes = Column(String)
        AmountTotal = Column(Decimal)
  "description": |-
    Represents an order made by a customer. Includes the total amount and a notes field.
  "name": |-
    Order
- "classname": |-
    Item
  "code": |-
    class Item(Base):
        __tablename__ = "item"

        Id = Column(Integer, primary_key=True, autoincrement=True)
        OrderId = Column(Integer, ForeignKey("order.Id"))
        ProductId = Column(Integer, ForeignKey("product.Id"))
        Quantity = Column(Integer)
        UnitPrice = Column(Decimal)
        Amount = Column(Decimal)
  "description": |-
    Represents items included in an order. Stores quantity, unit price, and total amount.
  "name": |-
    Item
- "classname": |-
    Product
  "code": |-
    class Product(Base):
        __tablename__ = "product"

        Id = Column(Integer, primary_key=True, autoincrement=True)
        Name = Column(String)
        UnitPrice = Column(Decimal)
  "description": |-
    Represents products that can be ordered. Stores the unit price.
  "name": |-
    Product
"name": |-
  CustomerOrderSystem
"rules":
- "code": |-
    Rule.constraint(validate=Customer,
                    as_condition=lambda row: row.Balance <= row.CreditLimit,
                    error_msg="Customer balance ({row.Balance}) exceeds credit limit ({row.CreditLimit})")
  "description": |-
    The Customer's balance must be less than the credit limit
  "entity": |-
    Customer
  "name": |-
    CustomerBalanceConstraint
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Customer.Balance, as_sum_of=Order.AmountTotal, where=lambda row: row.DateShipped is None)
  "description": |-
    The Customer's balance is the sum of the Order amount_total where date_shipped is null.
  "entity": |-
    Customer
  "name": |-
    CustomerBalanceSum
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Order.AmountTotal, as_sum_of=Item.Amount)
  "description": |-
    The Order's amount_total is the sum of the Item amount.
  "entity": |-
    Order
  "name": |-
    OrderAmountTotalSum
  "use_case": |-
    Check Credit
- "code": |-
    Rule.formula(derive=Item.Amount, as_expression=lambda row: row.Quantity * row.UnitPrice)
  "description": |-
    The Item amount is the quantity * unit_price.
  "entity": |-
    Item
  "name": |-
    ItemAmountFormula
  "use_case": |-
    Check Credit
- "code": |-
    Rule.copy(derive=Item.UnitPrice, from_parent=Product.UnitPrice)
  "description": |-
    The Item unit_price is copied from the Product unit_price.
  "entity": |-
    Item
  "name": |-
    ItemUnitPriceCopy
  "use_case": |-
    Check Credit
- "code": |-
    Rule.after_flush_row_event(on_class=Order, calling=kafka_producer.send_row_to_kafka,
                                if_condition=lambda row: row.DateShipped is not None,
                                with_args={"topic": "order_shipping"})
  "description": |-
    Send the Order to Kafka topic 'order_shipping' if the date_shipped is not None.
  "entity": |-
    Order
  "name": |-
    OrderToKafka
  "use_case": |-
    App Integration
"test_data": |-
  ## For Customer

  customer1 = Customer(Name="John Doe", CreditLimit=Decimal('1000.00'), Balance=Decimal('0.00'))
  customer2 = Customer(Name="Jane Smith", CreditLimit=Decimal('1500.00'), Balance=Decimal('0.00'))
  customer3 = Customer(Name="Alice Johnson", CreditLimit=Decimal('1200.00'), Balance=Decimal('0.00'))
  customer4 = Customer(Name="Bob Brown", CreditLimit=Decimal('2000.00'), Balance=Decimal('0.00'))


  ## For Order

  order1 = Order(CustomerId=1, DateShipped=date(2023, 5, 21), Notes="Urgent", AmountTotal=Decimal('250.00'))
  order2 = Order(CustomerId=2, DateShipped=None, Notes="Deliver to office", AmountTotal=Decimal('500.00'))
  order3 = Order(CustomerId=3, DateShipped=None, Notes="Gift", AmountTotal=Decimal('300.00'))
  order4 = Order(CustomerId=4, DateShipped=date(2023, 6, 11), Notes="Return customer", AmountTotal=Decimal('450.00'))


  ## For Item

  item1 = Item(OrderId=1, ProductId=1, Quantity=2, UnitPrice=Decimal('75.00'), Amount=Decimal('150.00'))
  item2 = Item(OrderId=2, ProductId=2, Quantity=5, UnitPrice=Decimal('50.00'), Amount=Decimal('250.00'))
  item3 = Item(OrderId=3, ProductId=3, Quantity=3, UnitPrice=Decimal('40.00'), Amount=Decimal('120.00'))
  item4 = Item(OrderId=4, ProductId=4, Quantity=4, UnitPrice=Decimal('65.00'), Amount=Decimal('260.00'))

  ## For Product

  product1 = Product(Name="Widget A", UnitPrice=Decimal('75.00'))
  product2 = Product(Name="Widget B", UnitPrice=Decimal('50.00'))
  product3 = Product(Name="Widget C", UnitPrice=Decimal('40.00'))
  product4 = Product(Name="Widget D", UnitPrice=Decimal('65.00'))
