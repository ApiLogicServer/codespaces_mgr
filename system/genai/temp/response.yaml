"graphics": []
"models":
- "classname": |-
    Customer
  "code": |-
    class Customer(Base):
        __tablename__ = 'customers'
        id = Column(Integer, primary_key=True, autoincrement=True)
        name = Column(String(255))
        balance = Column(Decimal)
        credit_limit = Column(Decimal)
  "description": |-
    Stores customer information including balance and credit limit
  "name": |-
    Customer
- "classname": |-
    Order
  "code": |-
    class Order(Base):
        __tablename__ = 'orders'
        id = Column(Integer, primary_key=True, autoincrement=True)
        customer_id = Column(Integer, ForeignKey('customers.id'))
        amount_total = Column(Decimal)
        date_shipped = Column(DateTime)
        notes = Column(String(255))
  "description": |-
    Represents customer orders including total amount and shipping date
  "name": |-
    Order
- "classname": |-
    Item
  "code": |-
    class Item(Base):
        __tablename__ = 'items'
        id = Column(Integer, primary_key=True, autoincrement=True)
        order_id = Column(Integer, ForeignKey('orders.id'))
        product_id = Column(Integer, ForeignKey('products.id'))
        quantity = Column(Integer)
        unit_price = Column(Decimal)
        amount = Column(Decimal)
  "description": |-
    Details of items included in orders, linked to products
  "name": |-
    Item
- "classname": |-
    Product
  "code": |-
    class Product(Base):
        __tablename__ = 'products'
        id = Column(Integer, primary_key=True, autoincrement=True)
        name = Column(String(255))
        unit_price = Column(Decimal)
  "description": |-
    Stores product information including unit price
  "name": |-
    Product
"name": |-
  ECommerceSystem
"rules":
- "code": |-
    Rule.constraint(validate=Customer, as_condition=lambda row: row.balance <= row.credit_limit, error_msg="Customer balance ({row.balance}) exceeds credit limit ({row.credit_limit})")
  "description": |-
    Ensure customer balance does not exceed credit limit
  "entity": |-
    Customer
  "name": |-
    Customer Balance Constraint
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Order.amount_total, as_sum_of=Item.amount)
  "description": |-
    Calculate order total as sum of item amounts
  "entity": |-
    Order
  "name": |-
    Order Total Derivation
  "use_case": |-
    Check Credit
- "code": |-
    Rule.formula(derive=Item.amount, as_expression=lambda row: row.quantity * row.unit_price)
  "description": |-
    Calculate item amount as quantity times unit price
  "entity": |-
    Item
  "name": |-
    Item Amount Derivation
  "use_case": |-
    Check Credit
- "code": |-
    Rule.copy(derive=Item.unit_price, from_parent=Product.unit_price)
  "description": |-
    Copy unit price from product to item
  "entity": |-
    Item
  "name": |-
    Item Unit Price Copy
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Customer.balance, as_sum_of=Order.amount_total, where=lambda row: row.date_shipped is None)
  "description": |-
    Calculate customer balance as sum of order totals where date_shipped is null
  "entity": |-
    Customer
  "name": |-
    Customer Balance Derivation
  "use_case": |-
    Check Credit
- "code": |-
    Rule.after_flush_row_event(on_class=Order, calling=kafka_producer.send_row_to_kafka, if_condition=lambda row: row.date_shipped is not None, with_args={"topic": "order_shipping"})
  "description": |-
    Send order data to Kafka if date_shipped is not None
  "entity": |-
    Order
  "name": |-
    Order App Integration
  "use_case": |-
    App Integration
