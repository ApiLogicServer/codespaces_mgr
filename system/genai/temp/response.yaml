"rules":
- "code": |-
    Rule.constraint(validate=Customer,
                     as_condition=lambda row: row.balance <= row.credit_limit,
                     error_msg="Customer balance ({row.balance}) exceeds credit limit ({row.credit_limit})")
  "description": |-
    Constraint to ensure customer's balance is less than credit limit.
  "entity": |-
    Customer
  "name": |-
    CheckCredit_CustomerBalanceConstraint
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Customer.balance, as_sum_of=Order.amount_total, where=lambda row: row.date_shipped is None)
  "description": |-
    Derive customer's balance as sum of orders' amount_total where date_shipped is null.
  "entity": |-
    Customer
  "name": |-
    CustomerBalanceDerivation
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Order.amount_total, as_sum_of=Item.amount)
  "description": |-
    Derive order's amount_total as sum of item's amount.
  "entity": |-
    Order
  "name": |-
    OrderAmountTotalDerivation
  "use_case": |-
    Check Credit
- "code": |-
    Rule.formula(derive=Item.amount, as_expression=lambda row: row.quantity * row.unit_price)
  "description": |-
    Derive item's amount as quantity times unit_price.
  "entity": |-
    Item
  "name": |-
    ItemAmountDerivation
  "use_case": |-
    Check Credit
- "code": |-
    Rule.copy(derive=Item.unit_price, from_parent=Product.unit_price)
  "description": |-
    Copy item's unit_price from product's unit_price.
  "entity": |-
    Item
  "name": |-
    ItemUnitPriceCopy
  "use_case": |-
    Check Credit
- "code": |-
    Rule.after_flush_row_event(on_class=Order, calling=kafka_producer.send_row_to_kafka,
                               if_condition=lambda row: row.date_shipped is not None,
                               with_args={"topic": "order_shipping"})
  "description": |-
    Send the order to Kafka topic 'order_shipping' if date_shipped is not None.
  "entity": |-
    Order
  "name": |-
    OrderShippingEvent
  "use_case": |-
    App Integration
