"models":
- "classname": |-
    Customer
  "code": |-
    class Customer(Base):
        __tablename__ = 'customer'

        # Primary Key
        id = Column(Integer, primary_key=True, autoincrement=True)

        # Attributes
        name = Column(String, nullable=False)
        credit_limit = Column(Decimal)
        balance = Column(Decimal, default=0)

        # Define relationships/foreign keys
        orders = relationship("Order", back_populates="customer")
  "description": |-
    Customer class with attributes and relationships to orders
  "name": |-
    Customer
- "classname": |-
    Order
  "code": |-
    class Order(Base):
        __tablename__ = 'order'

        # Primary Key
        id = Column(Integer, primary_key=True, autoincrement=True)

        # Foreign Keys
        customer_id = Column(Integer, ForeignKey('customer.id'))

        # Attributes
        amount_total = Column(Decimal, default=0)
        date_shipped = Column(DateTime)
        notes = Column(String)

        # Define relationships
        customer = relationship("Customer", back_populates="orders")
        items = relationship("Item", back_populates="order")
  "description": |-
    Order class linking to customer and containing notes, total amount, and shipping date
  "name": |-
    Order
- "classname": |-
    Item
  "code": |-
    class Item(Base):
        __tablename__ = 'item'

        # Primary Key
        id = Column(Integer, primary_key=True, autoincrement=True)

        # Foreign Keys
        order_id = Column(Integer, ForeignKey('order.id'))
        product_id = Column(Integer, ForeignKey('product.id'))

        # Attributes
        quantity = Column(Integer, default=0)
        unit_price = Column(Decimal)
        amount = Column(Decimal)

        # Define relationships
        order = relationship("Order", back_populates="items")
        product = relationship("Product")
  "description": |-
    Item class with a relationship to products and containing quantity, unit price, and amount
  "name": |-
    Item
- "classname": |-
    Product
  "code": |-
    class Product(Base):
        __tablename__ = 'product'

        # Primary Key
        id = Column(Integer, primary_key=True, autoincrement=True)

        # Attributes
        name = Column(String, nullable=False)
        unit_price = Column(Decimal)

        # Define relationships/foreign keys
        items = relationship("Item", back_populates="product")
  "description": |-
    Product class containing product details like name and unit price
  "name": |-
    Product
"name": |-
  CreditCheckSystem
"rules":
- "code": |-
    Rule.constraint(validate=Customer,
                            as_condition=lambda row: row.balance <= row.credit_limit,
                            error_msg="Customer balance ({row.balance}) exceeds credit limit ({row.credit_limit})")
  "description": |-
    Ensure that the customer's balance does not exceed their credit limit.
  "entity": |-
    Customer
  "name": |-
    Customer Balance Constraint
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Customer.balance, as_sum_of=Order.amount_total, where=lambda row: row.date_shipped is None)
  "description": |-
    Calculate the balance of the customer summing up the order amounts for pending shipments.
  "entity": |-
    Customer
  "name": |-
    Customer Balance Sum Rule
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Order.amount_total, as_sum_of=Item.amount)
  "description": |-
    Calculate the total amount for an order based on its items.
  "entity": |-
    Order
  "name": |-
    Order Amount Total Sum Rule
  "use_case": |-
    Check Credit
- "code": |-
    Rule.formula(derive=Item.amount, as_expression=lambda row: row.quantity * row.unit_price)
  "description": |-
    Derive item amount by multiplying quantity by unit price.
  "entity": |-
    Item
  "name": |-
    Item Amount Formula Rule
  "use_case": |-
    Check Credit
- "code": |-
    Rule.copy(derive=Item.unit_price, from_parent=Product.unit_price)
  "description": |-
    Copy product unit price into item unit price.
  "entity": |-
    Item
  "name": |-
    Item Unit Price Copy Rule
  "use_case": |-
    Check Credit
- "code": |-
    Rule.after_flush_row_event(on_class=Order, calling=kafka_producer.send_row_to_kafka,
                                   if_condition=lambda row: row.date_shipped is not None,
                                   with_args={"topic": "order_shipping"})
  "description": |-
    Send order to Kafka topic if the date_shipped is not null.
  "entity": |-
    Order
  "name": |-
    Order Kafka Send Event
  "use_case": |-
    App Integration
