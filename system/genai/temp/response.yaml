"graphics": []
"models":
- "classname": |-
    Customer
  "code": |-
    class Customer(Base):
        __tablename__ = 'customer'
        Id = Column(Integer, primary_key=True, autoincrement=True)
        Name = Column(String)
        CreditLimit = Column(Integer)
        Balance = Column(Integer)
  "description": |-
    Model for customers with a credit limit and balance.
  "name": |-
    Customer
- "classname": |-
    Order
  "code": |-
    class Order(Base):
        __tablename__ = 'order'
        Id = Column(Integer, primary_key=True, autoincrement=True)
        CustomerId = Column(Integer, ForeignKey('customer.Id'))
        DateShipped = Column(DateTime, nullable=True)
        AmountTotal = Column(Integer)
        Notes = Column(String)
  "description": |-
    Model for orders with a reference to customer and a notes field.
  "name": |-
    Order
- "classname": |-
    Item
  "code": |-
    class Item(Base):
        __tablename__ = 'item'
        Id = Column(Integer, primary_key=True, autoincrement=True)
        OrderId = Column(Integer, ForeignKey('order.Id'))
        ProductId = Column(Integer, ForeignKey('product.Id'))
        Quantity = Column(Integer)
        Amount = Column(Integer)
        UnitPrice = Column(Integer)
  "description": |-
    Model for items linked to orders and products.
  "name": |-
    Item
- "classname": |-
    Product
  "code": |-
    class Product(Base):
        __tablename__ = 'product'
        Id = Column(Integer, primary_key=True, autoincrement=True)
        Name = Column(String)
        UnitPrice = Column(Integer)
  "description": |-
    Model for products with a unit price.
  "name": |-
    Product
"name": |-
  OrderManagement
"rules":
- "code": |-
    Rule.constraint(validate=Customer,
                    as_condition=lambda row: row.Balance <= row.CreditLimit,
                    error_msg="Customer balance ({row.Balance}) exceeds credit limit ({row.CreditLimit})")
  "description": |-
    Ensure customer's balance does not exceed their credit limit.
  "entity": |-
    Customer
  "name": |-
    Rule 1
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Customer.Balance, as_sum_of=Order.AmountTotal, where=lambda row: row.DateShipped is None)
  "description": |-
    Derive customer's balance as the sum of order amount total where date shipped is null.
  "entity": |-
    Customer
  "name": |-
    Rule 2
  "use_case": |-
    Check Credit
- "code": |-
    Rule.sum(derive=Order.AmountTotal, as_sum_of=Item.Amount)
  "description": |-
    Derive order's amount total as the sum of item amount.
  "entity": |-
    Order
  "name": |-
    Rule 3
  "use_case": |-
    Check Credit
- "code": |-
    Rule.formula(derive=Item.Amount, as_expression=lambda row: row.Quantity * row.UnitPrice)
  "description": |-
    Calculate item's amount as quantity multiplied by unit price.
  "entity": |-
    Item
  "name": |-
    Rule 4
  "use_case": |-
    Check Credit
- "code": |-
    Rule.copy(derive=Item.UnitPrice, from_parent=Product.UnitPrice)
  "description": |-
    Copy item's unit price from product.
  "entity": |-
    Item
  "name": |-
    Rule 5
  "use_case": |-
    Check Credit
- "code": |-
    Rule.after_flush_row_event(on_class=Order, calling=kafka_producer.send_row_to_kafka,
                               if_condition=lambda row: row.DateShipped is not None,
                               with_args={"topic": "order_shipping"})
  "description": |-
    Send order to Kafka if date shipped is not none.
  "entity": |-
    Order
  "name": |-
    Rule 6
  "use_case": |-
    App Integration
